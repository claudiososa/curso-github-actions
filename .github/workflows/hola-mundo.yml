name: Aprendiendo github actions

on:
  push:
    branches:
      - aprendiendo-github-actions

jobs:
  hola-mundo:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup GO
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Exec file
      run: go run main.go

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
